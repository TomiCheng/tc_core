[package]
name = "tc_runtime"
description = "Low-level runtime support for the tc_rust workspace."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
std = []
disable-x86-sse2 = []
disable-x86-aes-ni = []
disable-x86-avx2 = []
disable-x86-bmi1 = []
disable-x86-bmi2 = []
disable-x86-pclmulqdq = []
disable-x86-pclmulqdq-v256 = []
disable-x86-pclmulqdq-v512 = []
disable-x86-sse41 = []
disable-x86-ssse3 = []
disable-aarch64-aes = []
disable-aarch64-dit = []
disable-aarch64-neon = []
disable-aarch64-sha2 = []
disable-aarch64-sha3 = []
disable-aarch64-sm4 = []

[dependencies]

# `cpufeatures` hard-errors on architectures it does not support, so it is
# scoped to aarch64. It pulls in `libc` only on Linux, Android, and Apple
# targets, which keeps every other build dependency-free.
[target.'cfg(target_arch = "aarch64")'.dependencies]
cpufeatures = "0.3.1"
